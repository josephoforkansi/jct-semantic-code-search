[project]
name = "jct-semantic-code-search"
version = "0.1.0"
description = "Intent-based semantic code search engine for Python"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "sentence-transformers",
    "numpy",
    "colorama",
    "rich>=14.3.3",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
jct = "jct.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jct"]

[tool.pytest.ini_options]
pythonpath = ["src"]
